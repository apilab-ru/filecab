packages:
  - apps/*
  - packages/*

strictPeerDependencies: true

# Preserve pnpm 10's release-age behavior for the existing dependency lockfile.
minimumReleaseAge: 0

allowBuilds:
  '@scarf/scarf': false
  '@parcel/watcher': false
  nx: true
  esbuild: true
  '@nestjs/core': true
  '@prisma/engines': true
  prisma: true
